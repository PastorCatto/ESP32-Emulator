# Sunton ESP32-2432S028R — "CYD" (Cheap Yellow Display)
#
# 2.8" ILI9341 320x240 with an XPT2046 resistive touch panel, on a plain
# ESP32-WROOM-32. No PSRAM.
#
# Pin assignments verified against the published ESP32-2432S028R pinout:
# https://randomnerdtutorials.com/cheap-yellow-display-esp32-2432s028r/
#
# NOTE ON TOUCH WIRING
# --------------------
# On this board the XPT2046 does NOT share the display's SPI bus. It has its
# own CLK/MOSI/MISO (25/32/39), which is why it is declared as a separate bus
# below.
#
# PURR OS's devices/cyd/device.pcat instead lists touch_sclk=14, touch_mosi=13,
# touch_miso=12 -- the display's pins. That disagrees with the hardware. This
# file describes the board, not any one firmware's belief about it, so if a
# firmware drives touch on the display bus the tracer will show its traffic
# going to an address nothing owns.

[board]
id = "cyd-esp32-2432s028r"
name = "CYD (ESP32-2432S028R)"
chip = "esp32"
flash_size = "4MB"

[board.psram]
kind = "none"
size = "0"

# HSPI (SPI2) drives the panel.
[[bus]]
id = "tft"
kind = "spi"
controller = 2
sck = 14
mosi = 13
miso = 12

# VSPI (SPI3) drives the SD slot.
[[bus]]
id = "sdspi"
kind = "spi"
controller = 3
sck = 18
mosi = 23
miso = 19

# The touch panel's own pins. Firmware usually reaches these with a software
# SPI or a remapped controller; see the limitation note at the bottom.
[[bus]]
id = "tspi"
kind = "spi"
controller = 4
sck = 25
mosi = 32
miso = 39

[[peripheral]]
kind = "ili9341"
label = "2.8in LCD"
bus = "tft"
cs = 15
dc = 2
backlight = 21
width = 320
height = 240
rotation = 0
color_order = "bgr"
invert = false

[[peripheral]]
kind = "xpt2046"
label = "resistive touch"
bus = "tspi"
cs = 33
irq = 36
width = 320
height = 240

[[peripheral]]
kind = "sdcard"
label = "microSD"
bus = "sdspi"
cs = 5

[[peripheral]]
kind = "rgb-led"
label = "onboard RGB LED"
red = 4
green = 16
blue = 17
active_low = true

[[peripheral]]
kind = "ldr"
label = "light sensor"
adc_pin = 34

# KNOWN LIMITATION
# ----------------
# We intercept SPI at the controller, so a firmware that bit-bangs touch over
# plain GPIO produces no SPI transactions for us to route -- it looks like
# GPIO toggling. Such a firmware's touch will not work in the emulator even
# though the board file is correct. Reconstructing a bus from GPIO edges is
# possible but not implemented.
[support]
implemented = []
planned = ["ili9341", "xpt2046", "sdcard"]
stubbed = ["rgb-led", "ldr"]
